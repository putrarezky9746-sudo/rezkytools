<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REZKYTOOLS</title><style>
:root{--bg:#0b0b0f;--card:#14141b;--line:#282833;--red:#e51d2a;--text:#f5f5f7;--muted:#a7a7b3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#09090c,#171018);color:var(--text);font-family:Inter,Arial,sans-serif}main{max-width:900px;margin:auto;padding:28px 16px}.brand{font-weight:900;font-size:30px;letter-spacing:1px}.brand span{color:var(--red)}.sub{color:var(--muted);margin:4px 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:rgba(20,20,27,.9);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 40px #0006}h2{margin:0 0 14px;font-size:18px}.status{display:flex;align-items:center;gap:10px;font-weight:700}.dot{width:11px;height:11px;border-radius:50%;background:#777}.ok{background:#24d26f}.warn{background:#f0b429}input,textarea{width:100%;background:#0c0c11;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;margin:6px 0 10px;outline:none}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;background:var(--red);color:white;font-weight:800;cursor:pointer}button.secondary{background:#24242d}.row{display:flex;gap:10px;flex-wrap:wrap}.qr{display:block;max-width:260px;width:100%;margin:12px auto;background:#fff;border-radius:12px}.small{font-size:13px;color:var(--muted)}pre{white-space:pre-wrap;color:#ff9da4;font-size:12px}
</style></head><body><main><div class="brand">REZKY<span>TOOLS</span></div><div class="sub">Railway WhatsApp Backend Dashboard</div><div class="grid"><section class="card"><h2>Status WhatsApp</h2><div class="status"><i id="dot" class="dot"></i><span id="status">Memuat...</span></div><p class="small" id="detail">Mengecek koneksi...</p><img id="qr" class="qr" style="display:none"><div class="row"><button class="secondary" onclick="refresh()">Refresh</button><button class="secondary" onclick="logout()">Logout</button></div></section><section class="card"><h2>Kirim Pesan</h2><input id="number" placeholder="628xxxxxxxxxx"><textarea id="message" placeholder="Tulis pesan..."></textarea><button onclick="send()">Kirim WhatsApp</button><p class="small" id="result"></p></section></div><section class="card" style="margin-top:16px"><h2>API Key</h2><input id="key" type="password" placeholder="Isi jika API_KEY di Railway aktif"><p class="small">API key hanya dipakai dari browser ke backend. Jangan menaruh secret di source code frontend.</p></section></main><script>
const $=id=>document.getElementById(id); function headers(){const k=$('key').value;return k?{'x-api-key':k}:{} } async function api(url,opt={}){opt.headers={...(opt.headers||{}),...headers(),'Content-Type':'application/json'};const r=await fetch(url,opt);return r.json()}
async function refresh(){try{const s=await api('/api/status');$('status').textContent=s.status;$('dot').className='dot '+(s.connected?'ok':s.qrAvailable?'warn':'');$('detail').textContent=s.error||'Backend aktif.';const q=await api('/api/qr');if(q.qr){$('qr').src=q.qr;$('qr').style.display='block'}else $('qr').style.display='none'}catch(e){$('status').textContent='BACKEND ERROR';$('detail').textContent=e.message}}
async function send(){const r=await api('/api/send-message',{method:'POST',body:JSON.stringify({number:$('number').value,message:$('message').value})});$('result').textContent=r.ok?'Pesan berhasil dikirim.':r.error}
async function logout(){const r=await api('/api/logout',{method:'POST'});$('result').textContent=r.ok?'Logout berhasil.':r.error;refresh()} refresh();setInterval(refresh,5000);
</script></body></html>
